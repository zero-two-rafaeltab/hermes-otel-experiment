name: otel
version: "1.4.0"
description: "Export privacy-conscious Hermes OpenTelemetry traces and metrics, including Codex subscription limits and a counterfactual OpenAI API-equivalent cost experiment. Content capture is disabled by default."
author: Zero Two
hooks:
  - pre_llm_call
  - post_llm_call
  - on_session_end
  - pre_api_request
  - post_api_request
  - api_request_error
  - pre_tool_call
  - post_tool_call
